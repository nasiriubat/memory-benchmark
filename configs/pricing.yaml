# Fallback pricing table (USD per 1,000,000 tokens).
#
# IMPORTANT: For OpenRouter runs, cost is computed from the LIVE OpenRouter
# model-catalog pricing captured in
# results/model_snapshots/{run_id}/resolved_models.yaml. This file is only a
# FALLBACK used when catalog pricing is unavailable (e.g. fully offline runs).
# Do not treat these numbers as authoritative.
pricing:
  default:
    input_per_1m: 0.0
    output_per_1m: 0.0
    cached_input_per_1m: 0.0
  # Optional per-provider-family fallbacks (illustrative, override as needed).
  # OpenAI direct pricing for gpt-5.5, short-context tier (<=272K tokens/request),
  # which all benchmark calls fall under. USD per 1,000,000 tokens.
  # NOTE: reasoning tokens are already counted inside output (completion) tokens
  # and billed at the output rate, so there is no separate reasoning rate here;
  # openai_client.py passes reasoning_tokens=0 to the cost estimate to avoid
  # double-charging.
  openai:
    input_per_1m: 5.0
    output_per_1m: 30.0
    cached_input_per_1m: 0.5
  anthropic:
    input_per_1m: 0.0
    output_per_1m: 0.0
    cached_input_per_1m: 0.0
  google:
    input_per_1m: 0.0
    output_per_1m: 0.0
    cached_input_per_1m: 0.0
  meta:
    input_per_1m: 0.0
    output_per_1m: 0.0
    cached_input_per_1m: 0.0
  deepseek:
    input_per_1m: 0.0
    output_per_1m: 0.0
    cached_input_per_1m: 0.0
