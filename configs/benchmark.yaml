# Top-level benchmark configuration.
#
# Scale presets (set BENCHMARK_PROFILE in .env): paper | memoryarena_100 | full | smoke
run:
  num_runs: 5
  retrieve_top_k: 3
  # Parallelism (LLM calls are I/O-bound, so these are the main speed lever).
  #   task_parallelism  : concurrent (task, iteration) jobs per model/domain.
  #   model_parallelism : concurrent model slots. Safe to raise (result writes
  #                       are locked); raising both multiplies provider
  #                       concurrency, so mind OpenRouter rate limits.
  # Override per run with TASK_PARALLELISM / MODEL_PARALLELISM env vars.
  model_parallelism: 1
  task_parallelism: 4
  fail_fast: false
  cross_task_memory: false
  max_tasks_per_domain: 0
  max_tasks_total: 0
  task_sample_strategy: sequential
  benchmark_task_seed: 42

profiles:
  paper:
    num_runs: 5
    max_tasks_per_domain: 50
    task_parallelism: 6
  # MemoryArena only: 100 tasks total (20 per config), STATE-Bench off.
  memoryarena_100:
    num_runs: 5
    max_tasks_total: 100
    task_sample_strategy: random
    benchmark_task_seed: 42
    benchmarks:
      state_bench:
        enabled: false
      memoryarena:
        enabled: true
      dfx:
        enabled: false
  # MemoryArena formal reasoning only (math + physics, all 60 tasks), STATE-Bench off.
  memoryarena_reasoning:
    num_runs: 5
    max_tasks_total: 0
    task_parallelism: 8
    task_sample_strategy: sequential
    benchmark_task_seed: 42
    benchmarks:
      state_bench:
        enabled: false
      memoryarena:
        enabled: true
        configs:
          - formal_reasoning_math
          - formal_reasoning_phys
      dfx:
        enabled: false
  # Cost-efficient, memory-relevant preset: MemoryArena bundled_shopping only,
  # 40 tasks (random, seed 42), 3 runs. Shopping is a multi-turn recall task
  # (recall the right product/ASIN across turns) where memory genuinely matters.
  memoryarena_shopping:
    num_runs: 3
    max_tasks_total: 40
    task_parallelism: 8
    task_sample_strategy: random
    benchmark_task_seed: 42
    benchmarks:
      state_bench:
        enabled: false
      memoryarena:
        enabled: true
        configs:
          - bundled_shopping
      dfx:
        enabled: false
  full:
    num_runs: 5
    max_tasks_per_domain: 0
    task_parallelism: 6
  smoke:
    num_runs: 1
    max_tasks_per_domain: 1
    # Keep smoke fully serial for a deterministic wiring check.
    task_parallelism: 1
    benchmarks:
      state_bench:
        enabled: true
      memoryarena:
        enabled: false
      dfx:
        enabled: false

benchmarks:
  state_bench:
    enabled: true
    # Microsoft STATE-Bench Agent Learning Track domains.
    domains:
      - travel
      - customer_support
      - shopping_assistant
    # Number of test repetitions; passed to the official runner when available.
    num_runs: 5
    retrieve_learnings_top_k: 3
  memoryarena:
    enabled: true
    configs:
      - bundled_shopping
      - progressive_search
      - group_travel_planner
      - formal_reasoning_math
      - formal_reasoning_phys
    # Hugging Face fallback dataset used only if the official repo is absent.
    hf_dataset: ZexueHe/memoryarena
  dfx:
    enabled: false
    path: data/dfx

# Evaluator configuration.
evaluators:
  # Judge model slot (resolved like any other model via the resolver).
  # Uses the cheap dedicated `judge` slot (benchmark_tier: judge) so memory
  # relevance/usage/consistency scoring does not run on the expensive frontier
  # model. The runner excludes judge-tier slots from the system-under-test loop.
  llm_judge_model: judge
  # Prefer official benchmark scores, then deterministic checks, then judge.
  rule_compliance_order: ["official", "deterministic", "llm_judge"]
  # How a subtask answer is graded for correctness (success/score/progress):
  #   token_f1  = deterministic token overlap (fails on MemoryArena's ASIN/dict
  #               answers — the agent cannot output internal ids).
  #   llm_judge = grade answer-vs-expected semantically with the cheap judge slot.
  answer_correctness_scorer: llm_judge
  answer_correctness_rubric: >
    You are grading a memory-agent benchmark answer. The EXPECTED answer encodes
    the correct choice, sometimes via internal identifiers (e.g. target_asin) or
    structured formatting that the agent cannot know or reproduce. Grade by the
    described item / attributes / values, NOT by exact ids or formatting. Score
    1.0 if the agent's answer clearly identifies the same item or decision as the
    expected answer, partial (0.3-0.7) if partially correct, and 0.0 if wrong,
    irrelevant, or missing.

# Statistical analysis (paper Section III-J).
statistics:
  enabled: true
  # Use resolved OpenRouter model ids (model_display) for backbone comparisons (RQ3).
  anova_factors: ["memory_system", "model_display"]
  anova_metrics:
    - success
    - score
    - progress_score
    - consistency_score
    - memory_utility_gain_vs_stateless
  alpha: 0.05
