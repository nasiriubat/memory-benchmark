# Explicit project name so Docker Desktop never merges with other Compose stacks.
name: memory-agent-benchmark

# ---------------------------------------------------------------------------
# memory-agent-benchmark Docker Compose.
#
# Design:
#   * One memory system runs at a time. Each memory system has a Compose
#     PROFILE so only that system's runner + self-hosted backing service(s)
#     start. Use scripts/run_one.sh (or `make run-<system>`) which stops any
#     running memory system before starting the next.
#   * Backing services are self-hosted and exposed ONLY on the internal
#     network (`expose:`), never published to the host. Only `ui` publishes a
#     host port (8501).
#   * Secrets are never baked into images; they are passed via environment.
# ---------------------------------------------------------------------------

x-benchmark-env: &benchmark-env
  # LLM provider: openrouter (default) | openai (direct OpenAI API).
  LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
  # OpenRouter (when LLM_PROVIDER=openrouter).
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
  OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-memory-agent-benchmark}
  OPENROUTER_USE_LATEST_ALIASES: ${OPENROUTER_USE_LATEST_ALIASES:-true}
  OPENROUTER_RESOLVE_LATEST_ONCE: ${OPENROUTER_RESOLVE_LATEST_ONCE:-true}
  OPENROUTER_STRICT_BENCHMARK_MODE: ${OPENROUTER_STRICT_BENCHMARK_MODE:-true}
  OPENROUTER_ALLOW_FALLBACKS: ${OPENROUTER_ALLOW_FALLBACKS:-false}
  OPENROUTER_REQUIRE_PARAMETERS: ${OPENROUTER_REQUIRE_PARAMETERS:-true}
  OPENROUTER_DATA_COLLECTION: ${OPENROUTER_DATA_COLLECTION:-deny}
  BENCHMARK_PROFILE: ${BENCHMARK_PROFILE:-}
  BENCHMARKS: ${BENCHMARKS:-}
  MEMORYARENA_CONFIGS: ${MEMORYARENA_CONFIGS:-}
  DEFAULT_NUM_RUNS: ${DEFAULT_NUM_RUNS:-5}
  MAX_TASKS_PER_DOMAIN: ${MAX_TASKS_PER_DOMAIN:-0}
  MAX_TASKS_TOTAL: ${MAX_TASKS_TOTAL:-0}
  TASK_SAMPLE_STRATEGY: ${TASK_SAMPLE_STRATEGY:-sequential}
  BENCHMARK_TASK_SEED: ${BENCHMARK_TASK_SEED:-42}
  MODELS: ${MODELS:-}
  MODEL_PARALLELISM: ${MODEL_PARALLELISM:-1}
  TASK_PARALLELISM: ${TASK_PARALLELISM:-4}
  RETRIEVE_TOP_K: ${RETRIEVE_TOP_K:-3}
  RUN_ID: ${RUN_ID:-}
  # Self-hosted memory backend endpoints (internal network hostnames).
  HINDSIGHT_BASE_URL: ${HINDSIGHT_BASE_URL:-http://hindsight-server:8888}
  HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
  # LLM inside the Hindsight container (fact extraction). Defaults to OpenRouter so
  # OPENROUTER_API_KEY in .env is enough; set HINDSIGHT_API_LLM_* to override.
  HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-openrouter}
  HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-${OPENROUTER_API_KEY}}
  HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-gpt-4o-mini}
  # AContext runs as its own stack (via `acontext server up`); the benchmark
  # connects to its API (port 8029, path /api/v1). From inside the container the
  # host is reached via host.docker.internal (see the acontext service below).
  ACONTEXT_BASE_URL: ${ACONTEXT_BASE_URL:-http://host.docker.internal:8029/api/v1}
  ACONTEXT_API_KEY: ${ACONTEXT_API_KEY:-}
  MEM0_BASE_URL: ${MEM0_BASE_URL:-http://mem0-qdrant:6333}
  MEM0_API_KEY: ${MEM0_API_KEY:-}
  # Cheap model mem0 uses internally for fact extraction (defaults to OPENAI_MODEL
  # in the adapter if unset). Kept consistent with the other memory systems.
  MEM0_LLM_MODEL: ${MEM0_LLM_MODEL:-gpt-4o-mini}
  ZEP_BASE_URL: ${ZEP_BASE_URL:-http://zep:8000}
  ZEP_API_KEY: ${ZEP_API_KEY:-}
  SUPERMEMORY_BASE_URL: ${SUPERMEMORY_BASE_URL:-http://supermemory:8000}
  SUPERMEMORY_API_KEY: ${SUPERMEMORY_API_KEY:-}

x-benchmark-base: &benchmark-base
  build:
    context: .
    dockerfile: Dockerfile
  image: memory-agent-benchmark:latest
  networks:
    - benchnet
  volumes:
    - ./results:/app/results
    - ./configs:/app/configs
    - ./data:/app/data

services:
  # === Memory-system runner services (one profile each) ====================
  stateless:
    <<: *benchmark-base
    profiles: ["stateless"]
    environment:
      <<: *benchmark-env
      MEMORY_SYSTEM: stateless
    command: python scripts/run_memory_system.py --memory-system stateless

  hindsight:
    <<: *benchmark-base
    profiles: ["hindsight"]
    environment:
      <<: *benchmark-env
      MEMORY_SYSTEM: hindsight
    command: python scripts/run_memory_system.py --memory-system hindsight
    depends_on:
      hindsight-server:
        condition: service_healthy

  acontext:
    <<: *benchmark-base
    profiles: ["acontext"]
    environment:
      <<: *benchmark-env
      MEMORY_SYSTEM: acontext
    command: python scripts/run_memory_system.py --memory-system acontext
    # AContext is NOT managed by this compose (it has its own 6-service stack
    # brought up by `acontext server up`). We reach its host-published API at
    # :8029 via host.docker.internal. Bring AContext up first (see RUNBOOK).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mem0:
    <<: *benchmark-base
    profiles: ["mem0"]
    environment:
      <<: *benchmark-env
      MEMORY_SYSTEM: mem0
    command: python scripts/run_memory_system.py --memory-system mem0
    depends_on:
      mem0-qdrant:
        condition: service_healthy

  zep:
    <<: *benchmark-base
    profiles: ["zep"]
    environment:
      <<: *benchmark-env
      MEMORY_SYSTEM: zep
    command: python scripts/run_memory_system.py --memory-system zep
    depends_on:
      - zep-backend

  supermemory:
    <<: *benchmark-base
    profiles: ["supermemory"]
    environment:
      <<: *benchmark-env
      MEMORY_SYSTEM: supermemory
    command: python scripts/run_memory_system.py --memory-system supermemory
    depends_on:
      - supermemory-backend

  # === Self-hosted memory backends (internal-only ports via `expose`) ======
  # mem0 uses a self-hosted Qdrant vector store.
  mem0-qdrant:
    image: qdrant/qdrant:latest
    profiles: ["mem0"]
    networks:
      - benchnet
    expose:
      - "6333"
    volumes:
      - mem0_qdrant_data:/qdrant/storage
    # Qdrant image ships bash but no curl/wget/nc, so probe the port via /dev/tcp.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Zep Community Edition + its Postgres (self-hosted, internal only).
  zep-postgres:
    image: postgres:16-alpine
    profiles: ["zep"]
    networks:
      - benchnet
    environment:
      POSTGRES_USER: zep
      POSTGRES_PASSWORD: zep
      POSTGRES_DB: zep
    expose:
      - "5432"
    volumes:
      - zep_pg_data:/var/lib/postgresql/data

  zep-backend:
    # Zep Community Edition. Self-hosted, internal network only.
    # Correct CE image is ghcr.io/getzep/zep (the old zepai/zep ref did not pull).
    image: ${ZEP_IMAGE:-ghcr.io/getzep/zep:latest}
    profiles: ["zep"]
    container_name: zep
    networks:
      - benchnet
    environment:
      ZEP_STORE_POSTGRES_DSN: postgres://zep:zep@zep-postgres:5432/zep?sslmode=disable
      # Zep CE runs its own LLM extraction. Exact env keys vary by Zep image
      # version; these cover the common graphiti-based CE config. Adjust to match
      # your image. Uses the same OpenAI key as the benchmark by default.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ZEP_LLM_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_NAME: ${ZEP_LLM_MODEL:-gpt-4o-mini}
    expose:
      - "8000"
    depends_on:
      - zep-postgres

  # Hindsight / AContext / Supermemory self-hosted services.
  # These reference local build contexts under ./selfhosted/<system> if you
  # vendor the upstream repos; otherwise the adapter logs "unavailable" and
  # degrades gracefully. Replace `image`/`build` with the real upstream as
  # needed for your environment.
  hindsight-server:
    # Vectorize Hindsight (API :8888, UI :9999). Same image as vectorize-io docs.
    image: ${HINDSIGHT_IMAGE:-ghcr.io/vectorize-io/hindsight:latest}
    profiles: ["hindsight"]
    container_name: memory-agent-hindsight
    restart: unless-stopped
    networks:
      - benchnet
    expose:
      - "8888"
      - "9999"
    env_file:
      - .env
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-openrouter}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-${OPENROUTER_API_KEY}}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-gpt-4o-mini}
    volumes:
      - hindsight_data:/home/hindsight/.pg0
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/v1/default/banks', timeout=5)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  # NOTE: AContext (memodb-io/Acontext) is a 6-service stack (api:8029, core,
  # postgres/pgvector, redis, rabbitmq, seaweedfs), NOT a single image. It runs
  # independently from a self-contained compose in ./acontext_server/ (gitignored)
  # with SANDBOX_TYPE=disabled; the `acontext` runner above connects to it via
  # host.docker.internal:8029. Bring it up with:
  #   cd acontext_server && docker compose --env-file .env up -d
  # The default-project SDK key is sk-ac-<ROOT_API_BEARER_TOKEN> (already set as
  # ACONTEXT_API_KEY in .env). See RUNBOOK "AContext setup".

  supermemory-backend:
    image: ${SUPERMEMORY_IMAGE:-ghcr.io/supermemoryai/supermemory:latest}
    # Starts together with the `supermemory` runner (was a separate profile that
    # never came up with the runner). NOTE: the default image ref above is a
    # placeholder and is NOT publicly pullable — set SUPERMEMORY_IMAGE to a real
    # image (or a local build context) before running this profile.
    profiles: ["supermemory"]
    container_name: supermemory
    networks:
      - benchnet
    expose:
      - "8000"

  # === Aggregation =========================================================
  aggregator:
    <<: *benchmark-base
    profiles: ["aggregator", "tools"]
    environment:
      <<: *benchmark-env
    command: python scripts/aggregate_results.py

  # === UI (the only service published to the host) =========================
  ui:
    <<: *benchmark-base
    profiles: ["ui"]
    environment:
      <<: *benchmark-env
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"

networks:
  benchnet:
    driver: bridge

volumes:
  mem0_qdrant_data:
  zep_pg_data:
  hindsight_data:
